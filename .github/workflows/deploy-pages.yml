name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install web builder
        run: python -m pip install pygame==2.6.1 pygbag==0.9.3

      - name: Prepare clean game package
        run: |
          mkdir -p pygbag-stage
          cp main.py pygbag.ini pygbag-stage/
          cp -R assets data src pygbag-stage/

      - name: Build WebAssembly game
        run: >-
          python -m pygbag --build
          --title "古籍解谜·中医传承"
          --width 1024
          --height 768
          --template web/index.tmpl
          pygbag-stage

      - name: Add GitHub Pages marker
        run: touch pygbag-stage/build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pygbag-stage/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
